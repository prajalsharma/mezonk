[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# Mezo docs and the MUSD repo target london. Cancun opcodes simulate fine but are not relied on.
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 256
depth = 128

[rpc_endpoints]
mezo_testnet = "${MEZO_TESTNET_RPC_URL}"
mezo_mainnet = "${MEZO_MAINNET_RPC_URL}"

[fmt]
line_length = 110
